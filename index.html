<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cube Capo Settings</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="container">
      <div class="left-section">
          <h2>Scramble</h2>
          <div>
            <label>Scramble
              <input type="text" id="scramble" placeholder="Enter scramble" value=""/>
            </label>

            <label title="If double moves can be replaced with a wide move + normal face move. Increases search time">Wide Replace Double
              <input type="checkbox" id="wideReplaceDouble"/>
            </label>

            <label title="If a the search should be tried on every orientation">Search Starting Rotations
              <input type="checkbox" id="searchRotations"/>
            </label>

            <label title="If the search should try every starting thumb placement (grip)">Search Starting Grips
              <input type="checkbox" id="searchStartingGrips"/>
            </label>
          </div>

          <button id="submitButton">Submit</button>
          <p id="errorMessage"></p>
          <div>
              <p id="output"></p>
          </div>

          <div>
            <details open>
              <summary>Format Options</summary>
              <div id="formatContent">
                <label title="Show starting thumb placement and mid-scramble regrip transitions in the output scramble string">Show Grips
                  <input type="checkbox" id="showGrips"/>
                </label>

                <label title="Convert wide moves to wedge count notation (e.g. Rw instead of r)">Wedge Notation
                  <input type="checkbox" id="wedgeNotation"/>
                </label>
              </div>
            </details>

            <details>
              <summary>Computation Settings</summary>
              <div id="advancedContent">
                <label title="Number of iterations to try on each orientation before bailing out">Max Iterations
                  <input type="number" id="iterations"/>
                </label>

                <label title="The most the current cost can be above the best cost before pruning the branch. Increase this if you have negative cost values">Pruning Threshold
                  <input type="number" id="depth"/>
                </label>

                <label title="If a rotation search should stop if worse than the best rotation. Disable if you want more data">Prune Starting Rotations
                  <input type="checkbox" id="pruneRotations"/>
                </label>

                <label title="If reaching an already visited state [current grip & scramble index & cube orientation] should prune the current branch. Disable if you want to ensure minimization">Memoize
                  <input type="checkbox" id="memoize"/>
                </label>
              </div>
            </details>

          </div>

          <h3>Cost Distribution</h3>
          <div id="myChart"></div>

          <table class="stats-table">
            <tr><th>Total Samples</th><td id="samples"></td></tr>
            <tr><th>Average Cost</th><td id="averageCost"></td></tr>
            <tr><th>Standard Deviation</th><td id="standardDeviation"></td></tr>
            <tr><th>Skewness</th><td id="skewness"></td></tr>
            <tr><th>Min Z-Score</th><td id="minZ"></td></tr>
          </table>
      </div>
      <div class="middle-section">
          <h2>Rotations</h2>
          <table class="breakdown-table" id="rotationTable">
            <thead>
              <tr><th>Rotation</th><th>Iterations</th><th>Best Cost</th>
            </thead>
            <tbody></tbody>
          </table>

          <table class="stats-table" id="searchTimeTable">
            <tr><th>Search Time</th><td id="searchTime"></td></tr>
          </table>

      </div>
      <div class="right-section">   
          <h2>Breakdown</h2>
          <table class="breakdown-table" id="costTable">
            <thead>
              <tr><th>Move</th><th>Next Grip</th><th>Fingertrick</th><th>Cost</th></tr>
            </thead>
            <tbody></tbody>
          </table>
      </div>
      <div class="cost-section">   
          <form id="costForm" class="cost-form">
            <h2>Cost Configuration</h2>
            <div class="tabs">
              <div class="tab-buttons">
                <button type="button" class="active" data-tab="general">General</button>
                <button type="button" data-tab="face">Move</button>
                <button type="button" data-tab="grip">Thumb Placement</button>
                <button type="button" data-tab="fingertricks">Fingertricks</button>
              </div>
                <div class="tab-content active" id="general" data-group="general"></div>
                <div class="tab-content" id="face" data-group="alpha"></div>
                <div class="tab-content" id="grip" data-group="grip"></div>
                <div class="tab-content" id="fingertricks" data-group="fingertrick"></div>
            </div>
          </form>
          <details style="text-align: right; margin-top: 12px;">
            <summary style="cursor: pointer; font-size: 13px; color: var(--text-muted);">Config Options</summary>
            <div id="configOptions">
              <button type="button" id="resetDefaultButton">Reset To Defaults</button>
              <button type="button" id="exportButton">Export</button>
              <button type="button" id="importButton">Import</button>
              <input id="importFile" type="file" accept=".json" class="hidden">
            </div>
          </details>
      </div>
    <footer class="footer-fixed">
      <a href="https://github.com/KeppyMarbles/CubeCapo"
         target="_blank" rel="noopener noreferrer">
        <img src="https://cdn.jsdelivr.net/gh/simple-icons/simple-icons/icons/github.svg"
             alt="GitHub">Source
      </a>
    </footer>
  </div>

  <div id="unsavedChangesBar" class="unsaved-changes-bar hidden">
    <span>You have unsaved changes.</span>
    <div class="bar-buttons">
      <button type="button" id="revertChangesButton" class="btn-revert">Revert</button>
      <button type="button" id="saveChangesButton" class="btn-save">Save</button>
    </div>
  </div>

  <script src="src/ui/breakdownTable.js"></script>
  <script type="module" src="main.js"></script>
</body>
</html>
